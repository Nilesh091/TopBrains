<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <ul id="list">
      <li>Apple</li>
      <li>Mango</li>
      <li>Banana</li>
    </ul>
    <script>
      let items = document.querySelectorAll("#list li");

      items.forEach(function (item) {
        item.addEventListener("dblclick", function () {
          item.remove();
        });
      });
    </script>
  </body>
</html>
